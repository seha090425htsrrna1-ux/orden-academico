<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Orden Académico</h1>
            <p class="subtitle">Regístrate para crear una cuenta</p>
            <form action="inicio.html" method="post">
                <label for="name">Nombre completo</label>
                <input type="text" id="name" name="name" placeholder="Ingresa tu nombre" required>

                <label for="email">Correo electrónico</label>
                <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>

                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Elige un nombre de usuario" required>

                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Crea una contraseña" required>

                <button type="submit">Registrarse</button>
                <a class="register-button" href="index.html">Iniciar sesión</a>
            </form>
        </div>
    </div>
</body>
</html>
